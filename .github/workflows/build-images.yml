name: Build and publish images

# Content edits arrive here as commits from the admin portal, so this workflow
# is the gate between "an editor pressed Save" and "the site changed".
# `npm run build` runs `astro check`, so malformed content fails here and never
# reaches a published image — the server keeps serving the previous one.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts of the repo this event touched. The admin image is built from
  # services/admin alone, so the usual push — an editor saving content — has no
  # reason to rebuild it. Private repositories draw on the organisation's monthly
  # Actions minutes, and this is the cheapest two minutes to stop spending.
  #
  # Asked through the API rather than by diffing a checkout: no clone is needed,
  # and there is no shallow-fetch depth to get wrong. Note that a job-level `if`
  # cannot do this itself — see the hashFiles() lesson in 5463149 — so the answer
  # has to come from a job output.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      admin: ${{ steps.decide.outputs.admin }}
    steps:
      - name: Decide whether the admin changed
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR: ${{ github.event.pull_request.number }}
        # Fail open. Every branch that cannot name the changed files builds
        # anyway: two wasted minutes is a far better outcome than skipping a real
        # change and leaving the server pulling a `latest` that never moved.
        run: |
          set -uo pipefail
          build() { echo "admin=true"  >> "$GITHUB_OUTPUT"; echo "-> building the admin"; exit 0; }
          skip()  { echo "admin=false" >> "$GITHUB_OUTPUT"; echo "-> skipping the admin"; exit 0; }

          if [ "$EVENT" = workflow_dispatch ]; then
            echo "Manual run: no diff to inspect."; build
          fi

          if [ -n "$PR" ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename')
          else
            echo "No base commit to compare against (a branch's first push)."; build
          fi

          if [ -z "${files:-}" ]; then
            echo "The API returned no file list."; build
          fi

          echo "Changed files:"; echo "$files" | sed 's/^/  /'

          # The workflow file counts: a change to how the admin is built or
          # tested has to reach the image it produces.
          if echo "$files" | grep -qE '^(services/admin/|\.github/workflows/build-images\.yml$)'; then
            build
          fi
          skip

  website:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check every entry exists in both languages
        run: node scripts/check-translation-pairs.mjs
      - name: Type-check and build
        run: npm run build

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/se4hc-web
          # `latest` only. A SHA tag per push would pin every build in GHCR
          # forever, and private packages on the Free plan get 500 MB.
          tags: type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Push a single manifest. Buildx otherwise attaches a provenance
          # attestation, which makes `latest` an index whose child manifests
          # show up in GHCR as untagged versions — and the prune step below
          # would then delete pieces of the image the tag still points at.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Moving `latest` leaves the previous manifest behind, untagged. Untagged
      # versions still count against the package allowance, and when it fills it
      # is the *push* that fails — CI goes red, no image is published, and the
      # server keeps serving the old one. So prune on every successful push.
      #
      # Two are kept: that is the rollback path now that there are no SHA tags.
      # `docker images --digests` on the server, or the GHCR versions page, names
      # a digest to pin: se4hc-web@sha256:... in the stack's .env.
      - name: Prune untagged versions
        if: github.event_name != 'pull_request'
        uses: actions/delete-package-versions@v5
        with:
          package-name: se4hc-web
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 2

  admin:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/admin/package-lock.json
      - name: Test
        working-directory: services/admin
        # Dummy values: the suite exercises parsing, the route tree and the auth
        # guards, none of which reach Postgres or the GitHub API.
        env:
          DATABASE_URL: postgres://ci@localhost/ci
          AUTH_SECRET: ci-secret
          GITHUB_TOKEN: ci-token
        run: |
          npm ci
          npm test

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/se4hc-admin
          # `latest` only. A SHA tag per push would pin every build in GHCR
          # forever, and private packages on the Free plan get 500 MB.
          tags: type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./services/admin
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Push a single manifest. Buildx otherwise attaches a provenance
          # attestation, which makes `latest` an index whose child manifests
          # show up in GHCR as untagged versions — and the prune step below
          # would then delete pieces of the image the tag still points at.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Moving `latest` leaves the previous manifest behind, untagged. Untagged
      # versions still count against the package allowance, and when it fills it
      # is the *push* that fails — CI goes red, no image is published, and the
      # server keeps serving the old one. So prune on every successful push.
      #
      # Two are kept: that is the rollback path now that there are no SHA tags.
      # `docker images --digests` on the server, or the GHCR versions page, names
      # a digest to pin: se4hc-admin@sha256:... in the stack's .env.
      - name: Prune untagged versions
        if: github.event_name != 'pull_request'
        uses: actions/delete-package-versions@v5
        with:
          package-name: se4hc-admin
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 2
