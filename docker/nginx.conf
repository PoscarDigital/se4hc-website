server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Emit relative Location headers. This container sits behind Caddy, so an
    # absolute redirect would be built from the container's own name and port
    # and send visitors somewhere that does not exist from outside. Astro's
    # directory routes make these redirects routine (/en -> /en/).
    absolute_redirect off;
    server_tokens off;

    # Astro's static build emits directory-style routes (/news/index.html),
    # so fall through to the directory index before giving up.
    #
    # Ending with `=404` rather than `/404.html` matters: naming the file here
    # would serve the not-found page with a 200, so crawlers and uptime checks
    # would read every missing page as healthy. `error_page` renders the same
    # page with the correct status.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Fingerprinted build assets are safe to cache forever.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Documents committed to the repo. When MinIO is enabled these are served
    # from object storage instead and this block simply goes unused.
    location /documents/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
